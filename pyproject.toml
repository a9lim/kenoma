[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kenoma"
dynamic = ["version"]
description = "A shell powered by LLM completion"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "a9lim", email = "mx@a9l.im" },
]
keywords = [
    "llm",
    "terminal",
    "shell",
    "hallucination",
    "completion",
    "mlx",
    "vllm",
    "loom",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Emulators",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "prompt_toolkit>=3.0.40",
    # The local engine. Elsewhere, kenoma talks to an OpenAI-compatible
    # server (--url) and needs nothing else.
    "mlx-lm>=0.30; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6.9",
    "pyright>=1.1.400",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
kenoma = "kenoma.cli:main"

# URL labels here are the ones PyPI's sidebar specifically renders with
# icons (Source, Issues, Changelog, Documentation, Funding); other labels
# render as plain text links.
[project.urls]
Homepage      = "https://github.com/a9lim/kenoma"
Source        = "https://github.com/a9lim/kenoma"
Issues        = "https://github.com/a9lim/kenoma/issues"
Changelog     = "https://github.com/a9lim/kenoma/releases"
Documentation = "https://github.com/a9lim/kenoma#readme"

[tool.setuptools]
packages = ["kenoma"]

[tool.setuptools.dynamic]
# Single source of truth: ``__version__`` in kenoma/__init__.py, which
# setuptools reads without importing the package.
version = { attr = "kenoma.__version__" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
# E501: long help strings and docstrings read better unbroken.
ignore = ["E501"]

# ``standard`` mode with the rules that catch real bugs escalated to error.
# mlx-lm is imported lazily inside MLXEngine and is absent on Linux CI, so
# missing imports are only warnings.
[tool.pyright]
include = ["kenoma", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportMissingImports = "warning"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportAttributeAccessIssue = "error"
reportArgumentType = "error"
reportCallIssue = "error"
reportReturnType = "error"
reportAssignmentType = "error"
reportUnnecessaryIsInstance = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
