name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # mlx-lm is Apple-silicon only (skipped by its marker); the tests use a
      # scripted engine and need no model.
      - run: pip install -e ".[dev]"
      - run: pytest -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # Dev extras for pytest and prompt_toolkit stubs; mlx-lm is absent on
      # Linux, so its lazy imports are reported as warnings only.
      - run: pip install -e ".[dev]"
      - run: pyright

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # pyproject.toml declares the version as `dynamic` and reads it from
      # kenoma.__version__ via setuptools' `attr:`. This job verifies it
      # resolves end to end after install.
      - run: pip install .
      - name: Verify dynamic version resolves
        run: |
          python - <<'PY'
          import importlib.metadata
          import kenoma
          installed = importlib.metadata.version("kenoma")
          if installed != kenoma.__version__:
              raise SystemExit(
                  f"dynamic version mismatch: installed={installed}, "
                  f"__version__={kenoma.__version__}"
              )
          print(f"OK: kenoma {installed}")
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check artifacts
        run: python -m twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
